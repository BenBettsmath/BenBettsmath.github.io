<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e293b">
<meta name="robots" content="noindex, nofollow">
<title>Games</title>
<link rel="icon" href="chess/icon.svg">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Roboto, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 12px; background: #1e293b; }
  header a { width: 40px; height: 40px; border-radius: 10px; background: #334155; color: #e2e8f0; text-decoration: none; display: grid; place-items: center; font-size: 1.2rem; }
  header h1 { flex: 1; text-align: center; font-size: 1.1rem; margin: 0 48px 0 0; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 12px; display: grid; gap: 12px; }
  .game { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; background: #1e293b; color: inherit; text-decoration: none; border: 2px solid transparent; }
  .game:hover, .game:focus { border-color: #38bdf8; }
  .game img { width: 48px; height: 48px; }
  .game h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .game p { margin: 0; color: #94a3b8; font-size: 0.9rem; }
</style>
</head>
<body>
<header><a href="../" aria-label="Back to apps">&larr;</a><h1>Games</h1></header>
<main>
  <a class="game" href="chess/index.html">
    <img src="chess/icon.svg" alt="">
    <div><h2>Chess</h2><p>Play a friend or the bot, or work through puzzles at three levels.</p></div>
  </a>
</main>
</body>
</html>
