<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e293b">
<meta name="robots" content="noindex, nofollow">
<title>Apps</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Roboto, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header { padding: 14px 12px; background: #1e293b; text-align: center; }
  header h1 { font-size: 1.1rem; margin: 0; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 12px; display: grid; gap: 12px; }
  .app { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; background: #1e293b; color: inherit; text-decoration: none; border: 2px solid transparent; }
  .app:hover, .app:focus { border-color: #38bdf8; }
  .app img { width: 48px; height: 48px; }
  .app h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .app p { margin: 0; color: #94a3b8; font-size: 0.9rem; }
</style>
</head>
<body>
<header><h1>Apps</h1></header>
<main>
  <a class="app" href="flashcards/index.html">
    <img src="flashcards/icon.svg" alt="">
    <div><h2>Flashcards</h2><p>German vocabulary and grammar, one topic every couple of days.</p></div>
  </a>
  <a class="app" href="games/index.html">
    <img src="games/chess/icon.svg" alt="">
    <div><h2>Games</h2><p>Chess and chess puzzles.</p></div>
  </a>
</main>
</body>
</html>
