<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="stylesheet" href="style.css">
<style>
.page-content { max-width: 820px; }
.hub { display: flex; gap: 1em; flex-wrap: wrap; margin: 1.4em 0; }
.hub .slot { flex: 1 1 240px; min-height: 4.6em; border: 1px dashed #cfd3d8; border-radius: 8px; background: #fafafa; }
.homcx { margin: 1.4em 0; }
.homcx-formula {
  font-family: 'STIX Two Text', Georgia, serif;
  font-size: 17px; text-align: center; margin: 0 0 10px;
}
.homcx-formula i { font-style: italic; }
.homcx-scene { border: 1px solid #E8E9EA; border-radius: 8px; background: #fff; overflow: hidden; }
.homcx-scene canvas { display: block; width: 100%; height: 500px; cursor: grab; touch-action: none; }
@media screen and (max-width: 600px) { .homcx-scene canvas { height: 400px; } }
</style>
</head>
<body>
<div class="topnav" id="myTopnav">
  <a href="index.html">Home</a>
  <a href="research.html" class="active">Research</a>
  <a href="teaching.html">Teaching</a>
  <a href="cv.html">CV</a>
  <a href="javascript:void(0);" class="icon" onclick="toggleNav()">&#9776;</a>
</div>
<div class="page-content">
  <p class="breadcrumb"><a href="research.html">Research</a> &rsaquo; <span>Notes</span></p>
  <h1>Notes</h1>
  <div class="hub">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>
  <div class="homcx">
    <p class="homcx-formula">
      Hom(<i>M</i>,&thinsp;<i>N</i>)<sub><i>i</i></sub> = &prod;<sub><i>j</i></sub>&thinsp;Hom<sub><i>R</i></sub>(<i>M</i><sub><i>j</i></sub>,&thinsp;<i>N</i><sub><i>j</i>+<i>i</i></sub>),
      &nbsp;&nbsp; &part;(<i>f</i>) = &part;<sup><i>N</i></sup><i>f</i> &minus; (&minus;1)<sup><i>i</i></sup><i>f</i>&thinsp;&part;<sup><i>M</i></sup>
    </p>
    <div class="homcx-scene"><canvas id="homcx-cv"></canvas></div>
  </div>
</div>
<footer>
  <a href="mailto:fraughn@unm.edu">fraughn@unm.edu</a> &nbsp;|&nbsp; Department of Mathematics and Statistics, University of New Mexico
</footer>
<script>
function toggleNav() { document.getElementById("myTopnav").classList.toggle("responsive") }
</script>
<script>
(function () {
  const cv = document.getElementById('homcx-cv');
  const ctx = cv.getContext('2d');
  const C = {
    ink: '#1E1E1E', soft: '#6B7280', rail: '#8A93A3',
    deg0: '#2563C9', deg1: '#1F8A5B', degm1: '#C77E1F',
    deg2: '#7A4FBF', degm2: '#A34A8C', defect: '#BA0C2F'
  };
  const HOME = { yaw: -0.32, pitch: 0.26 };
  const state = { yaw: HOME.yaw, pitch: HOME.pitch, sel: null };
  const COLOR_OF = i => ({ '2': C.deg2, '1': C.deg1, '0': C.deg0, '-1': C.degm1, '-2': C.degm2 })[String(i)];

  const S = 1.6, H = 1.05, ZB = -2.4;
  const mNode = j => [-(j - 1.5) * S,  H, 0];
  const nNode = j => [-(j - 1.5) * S, -H, 0];
  const colX  = i => -(i - 1.5) * S;
  const SUB = ['₀', '₁', '₂', '₃', '₄', '₅'];
  const subi = i => (i < 0 ? '₋' : '') + SUB[Math.abs(i)];
  const jRange = i => [Math.max(0, -i), Math.min(3, 4 - i)];
  const DEGS = [2, 1, 0, -1, -2];

  let W = 0, Hpx = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    W = r.width; Hpx = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hpx * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  new ResizeObserver(resize).observe(cv);
  addEventListener('resize', resize);
  setTimeout(resize, 60);
  setTimeout(resize, 350);

  function project(p, zoom) {
    const x0 = p[0], y0 = p[1], z0 = p[2];
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const cx = Math.cos(state.pitch), sx = Math.sin(state.pitch);
    let x = cy * x0 + sy * z0;
    let z = -sy * x0 + cy * z0;
    let y = cx * y0 - sx * z;
    z = sx * y0 + cx * z;
    const f = 12, per = f / (f - Math.min(z, f - 1));
    const k = Math.min(W, Hpx * 1.55) / 9.2 * zoom;
    return { x: W / 2 + x * k * per, y: Hpx / 2 - y * k * per, z: z };
  }
  function bez(a, c, b, t) {
    const u = 1 - t;
    return [0, 1, 2].map(k => u * u * a[k] + 2 * u * t * c[k] + t * t * b[k]);
  }
  function trim(pts, r0, r1) {
    let i = 0, j = pts.length - 1;
    const d = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
    while (i < j - 1 && d(pts[i + 1], pts[0]) < r0) i++;
    while (j > i + 1 && d(pts[j - 1], pts[pts.length - 1]) < r1) j--;
    return pts.slice(i, j + 1);
  }
  function strokeArrow(pts, o) {
    if (pts.length < 2) return;
    const depth = pts.reduce((s, p) => s + p.z, 0) / pts.length;
    const fade = Math.max(0.45, Math.min(1, 1 + depth * 0.16));
    ctx.save();
    ctx.globalAlpha = (o.alpha == null ? 1 : o.alpha) * fade;
    ctx.strokeStyle = o.color; ctx.fillStyle = o.color;
    ctx.lineWidth = (o.width || 1.6) * Math.max(0.7, 1 + depth * 0.08);
    ctx.setLineDash(o.dash || []);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
    ctx.stroke();
    ctx.setLineDash([]);
    const e = pts[pts.length - 1], p = pts[Math.max(0, pts.length - 3)];
    const ang = Math.atan2(e.y - p.y, e.x - p.x);
    const L = 8.5 + (o.width || 1.6);
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x - L * Math.cos(ang - 0.44), e.y - L * Math.sin(ang - 0.44));
    ctx.lineTo(e.x - L * Math.cos(ang + 0.44), e.y - L * Math.sin(ang + 0.44));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  let labelScale = 1;
  function labelAt(x, y, text, color, size, o) {
    o = o || {};
    ctx.save();
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    ctx.font = (o.bold ? 'bold ' : '') + 'italic ' + ((size || 15) * labelScale) + 'px "STIX Two Text", Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function buildScene() {
    const nodes = [], arrows = [], quads = [];
    const sel = state.sel;
    const foc = (sel && sel.type === 'factor') ? sel : null;
    const selCol = (sel && sel.type === 'col') ? sel.i : null;
    const selNode = (sel && sel.type === 'node') ? sel : null;
    for (let j = 0; j <= 3; j++) nodes.push({
      pos: mNode(j), text: 'M' + SUB[j], obj: { c: 'M', j },
      bold: !!(selNode && selNode.c === 'M' && selNode.j === j)
    });
    for (let j = 0; j <= 4; j++) nodes.push({
      pos: nNode(j), text: 'N' + SUB[j], obj: { c: 'N', j },
      bold: !!(selNode && selNode.c === 'N' && selNode.j === j)
    });
    nodes.push({ pos: mNode(4), text: '⋯' });
    nodes.push({ pos: nNode(5), text: '⋯' });
    const railHot = (c, j) => selNode && selNode.c === c && (selNode.j === j || selNode.j === j - 1);
    for (let j = 4; j >= 1; j--) arrows.push({
      a: mNode(j), b: mNode(j - 1), color: railHot('M', j) ? C.ink : C.rail,
      width: railHot('M', j) ? 2.8 : 1.4,
      label: j <= 3 ? '∂ᴹ' + SUB[j] : '', off: [0, -14], r0: 20, r1: 20
    });
    for (let j = 5; j >= 1; j--) arrows.push({
      a: nNode(j), b: nNode(j - 1), color: railHot('N', j) ? C.ink : C.rail,
      width: railHot('N', j) ? 2.8 : 1.4,
      label: j <= 4 ? '∂ᴺ' + SUB[j] : '', off: [0, 16], r0: 20, r1: 20
    });

    const bulgeOf = i => 0.85 * i;
    const hasP1 = foc && foc.j - 1 >= jRange(foc.i)[0];
    const hasP2 = foc && foc.j + 1 <= jRange(foc.i)[1];
    const roleOf = (i, j) => {
      if (!foc) return 'none';
      if (foc.i === i && foc.j === j) return 'foc';
      if (foc.i === i && ((j === foc.j - 1 && hasP1) || (j === foc.j + 1 && hasP2))) return 'partner';
      return 'dim';
    };
    const LAB_OFF = { '2': [10, -22], '1': [10, -18], '0': [-26, 0], '-1': [-6, 20], '-2': [-10, 24] };
    for (const i of DEGS) {
      const lo = jRange(i)[0], hi = jRange(i)[1];
      for (let j = lo; j <= hi; j++) {
        const rel = roleOf(i, j);
        let alpha = rel === 'dim' ? 0.15 : 1;
        if (selCol !== null) alpha = (i === selCol) ? 1 : 0.15;
        arrows.push({
          a: mNode(j), b: nNode(j + i), bulge: bulgeOf(i), color: COLOR_OF(i),
          width: rel === 'foc' ? 3.4 : rel === 'partner' ? 2.6 : 2,
          alpha,
          label: j === hi ? 'i = ' + (i < 0 ? '−' + (-i) : i) : '', off: LAB_OFF[String(i)], r0: 15, r1: 15
        });
      }
    }

    let focPos = null;
    const eP = {};
    const dy = 0.6;
    for (const i of DEGS) {
      const lo = jRange(i)[0], hi = jRange(i)[1], n = hi - lo + 1;
      nodes.push({
        pos: [colX(i), 1.9, ZB], text: 'Hom' + subi(i), color: COLOR_OF(i), size: 14,
        back: true, col: i, bold: selCol === i,
        alpha: selCol !== null && selCol !== i ? 0.35 : 1
      });
      for (let j = lo, k = 0; j <= hi; j++, k++) {
        const pos = [colX(i), (n - 1) / 2 * dy - k * dy, ZB];
        eP[i + ',' + j] = pos;
        const isFoc = foc && foc.i === i && foc.j === j;
        if (isFoc) focPos = pos;
        const isPartner = foc && foc.i === i &&
          ((j === foc.j - 1 && hasP1) || (j === foc.j + 1 && hasP2));
        const isReceiver = foc && i === foc.i - 1 &&
          ((j === foc.j && hasP1) || (j === foc.j + 1 && hasP2));
        let alpha = !foc || isFoc || isPartner || isReceiver ? 1 : 0.3;
        if (selCol !== null) alpha = (i === selCol) ? 1 : 0.3;
        nodes.push({
          pos, text: '(M' + SUB[j] + ',N' + SUB[j + i] + ')',
          color: isReceiver ? C.defect : COLOR_OF(i), size: 12.5, back: true, fac: { i, j },
          alpha, bold: isFoc || isReceiver
        });
      }
      nodes.push({
        pos: [colX(i), -(n - 1) / 2 * dy - dy, ZB], text: '⋮', color: C.soft, size: 13, back: true,
        alpha: (foc || (selCol !== null && selCol !== i)) ? 0.35 : 1
      });
    }
    if (selCol !== null) {
      const hy = 2.45;
      if (selCol + 1 <= 2) arrows.push({
        a: [colX(selCol + 1), hy, ZB], b: [colX(selCol), hy, ZB],
        color: C.defect, width: 1.8, dash: [6, 4], alpha: 0.95,
        label: '∂' + subi(selCol + 1), off: [0, -13], r0: 10, r1: 10
      });
      if (selCol - 1 >= -2) arrows.push({
        a: [colX(selCol), hy, ZB], b: [colX(selCol - 1), hy, ZB],
        color: C.soft, width: 1.8, dash: [6, 4], alpha: 0.95,
        label: '∂' + subi(selCol), off: [0, -13], r0: 10, r1: 10
      });
    }
    if (foc) {
      const conn = (fk, tk, lab, strong) => {
        const A = eP[fk], B = eP[tk];
        if (!A || !B) return;
        arrows.push({
          a: A, b: B, bulge: 0.25, cyo: -0.32, color: C.defect,
          width: strong ? 2 : 1.3, dash: strong ? [] : [4, 4],
          alpha: strong ? 0.95 : 0.55,
          label: lab || '', off: [0, 13], lsize: 12,
          r0: 26 * labelScale, r1: 26 * labelScale
        });
      };
      const fi = foc.i, fj = foc.j;
      const hasP1c = foc.j - 1 >= jRange(foc.i)[0];
      const hasP2c = foc.j + 1 <= jRange(foc.i)[1];
      if (hasP1c) {
        conn(fi + ',' + fj, (fi - 1) + ',' + fj, '∂ᴺ∘–', true);
        conn(fi + ',' + (fj - 1), (fi - 1) + ',' + fj, '', false);
      }
      if (hasP2c) {
        conn(fi + ',' + fj, (fi - 1) + ',' + (fj + 1), '–∘∂ᴹ', true);
        conn(fi + ',' + (fj + 1), (fi - 1) + ',' + (fj + 1), '', false);
      }
    }

    if (foc && focPos) {
      const c = COLOR_OF(foc.i);
      const i = foc.i, j = foc.j, k = j + i, bi = bulgeOf(i);
      arrows.push({
        a: focPos, b: mNode(j), color: c, width: 1.4, dash: [3, 4],
        alpha: 0.9, r0: 34 * labelScale, r1: 16
      });
      arrows.push({
        a: focPos, b: nNode(k), color: c, width: 1.4, dash: [3, 4],
        alpha: 0.9, r0: 34 * labelScale, r1: 16
      });
      if (hasP1) {
        quads.push({ color: c, alpha: 0.08, segs: [
          { a: mNode(j - 1), b: mNode(j), bulge: 0 },
          { a: mNode(j), b: nNode(k), bulge: bi },
          { a: nNode(k), b: nNode(k - 1), bulge: 0 },
          { a: nNode(k - 1), b: mNode(j - 1), bulge: bi }
        ]});
        arrows.push({
          a: mNode(j), b: nNode(k - 1), bulge: bulgeOf(i - 1) + 0.55,
          color: C.defect, width: 2, dash: [7, 5],
          label: '(∂f)' + SUB[j], off: [0, 26], r0: 15, r1: 15
        });
      }
      if (hasP2) {
        quads.push({ color: c, alpha: 0.08, segs: [
          { a: mNode(j + 1), b: mNode(j), bulge: 0 },
          { a: mNode(j), b: nNode(k), bulge: bi },
          { a: nNode(k), b: nNode(k + 1), bulge: 0 },
          { a: nNode(k + 1), b: mNode(j + 1), bulge: bi }
        ]});
        arrows.push({
          a: mNode(j + 1), b: nNode(k), bulge: bulgeOf(i - 1) + 0.55,
          color: C.defect, width: 2, dash: [7, 5],
          label: '(∂f)' + SUB[j + 1], off: [0, -26], r0: 15, r1: 15
        });
      }
    }
    return { nodes, arrows, quads, zoom: 0.6, xshift: 0 };
  }

  let curShift = 0;
  let entryHits = [];
  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, Hpx);
    labelScale = Math.max(0.72, Math.min(1.1, (Math.min(W, Hpx * 1.55) / 9.2) / 85));
    const sc = buildScene();
    curShift = sc.xshift || 0;
    const proj = p => project([p[0] + curShift, p[1], p[2]], sc.zoom);
    entryHits = [];
    for (const nd of sc.nodes) {
      if (!nd.back) continue;
      const p = proj(nd.pos);
      labelAt(p.x, p.y, nd.text, nd.color || C.ink, nd.size || 18, { alpha: nd.alpha, bold: nd.bold });
      if (nd.fac) entryHits.push({ kind: 'factor', x: p.x, y: p.y, i: nd.fac.i, j: nd.fac.j, w: 36, h: 10 });
      if (nd.col !== undefined) entryHits.push({ kind: 'col', x: p.x, y: p.y, i: nd.col, w: 34, h: 11 });
    }
    for (const q of sc.quads) {
      ctx.save();
      ctx.globalAlpha = q.alpha;
      ctx.fillStyle = q.color;
      ctx.beginPath();
      let first = true;
      for (const sg of q.segs) {
        const c = [(sg.a[0] + sg.b[0]) / 2, (sg.a[1] + sg.b[1]) / 2, (sg.a[2] + sg.b[2]) / 2 + (sg.bulge || 0)];
        for (let k = 0; k <= 12; k++) {
          const p = proj(bez(sg.a, c, sg.b, k / 12));
          if (first) { ctx.moveTo(p.x, p.y); first = false; } else ctx.lineTo(p.x, p.y);
        }
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const geoms = sc.arrows
      .filter(a => (a.alpha == null ? 1 : a.alpha) > 0)
      .map(a => {
        const c = [(a.a[0] + a.b[0]) / 2, (a.a[1] + a.b[1]) / 2 + (a.cyo || 0), (a.a[2] + a.b[2]) / 2 + (a.bulge || 0)];
        const pts = [];
        for (let k = 0; k <= 28; k++) pts.push(proj(bez(a.a, c, a.b, k / 28)));
        return { a, pts, depth: pts.reduce((s, p) => s + p.z, 0) / pts.length };
      })
      .sort((p, q) => p.depth - q.depth);
    for (const g of geoms) {
      strokeArrow(trim(g.pts, g.a.r0 || 14, g.a.r1 || 14), g.a);
      if (g.a.label) {
        const mid = g.pts[14];
        labelAt(mid.x + (g.a.off ? g.a.off[0] : 0), mid.y + (g.a.off ? g.a.off[1] : 0),
                g.a.label, g.a.color, g.a.lsize || 14.5, { alpha: g.a.alpha });
      }
    }
    for (const nd of sc.nodes) {
      if (nd.back) continue;
      const p = proj(nd.pos);
      labelAt(p.x, p.y, nd.text, nd.color || C.ink, nd.size || 18, { bold: nd.bold });
      if (nd.obj) entryHits.push({ kind: 'node', x: p.x, y: p.y, c: nd.obj.c, j: nd.obj.j, w: 20, h: 14 });
    }
  }

  let drag = null, moved = 0;
  cv.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY }; moved = 0;
    cv.style.cursor = 'grabbing';
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
    state.yaw += (e.clientX - drag.x) * 0.008;
    state.pitch = Math.max(-1.1, Math.min(1.1, state.pitch + (e.clientY - drag.y) * 0.008));
    drag = { x: e.clientX, y: e.clientY };
    draw();
  });
  cv.addEventListener('pointerup', e => {
    cv.style.cursor = 'grab';
    if (drag && moved < 5) {
      const r = cv.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      let hit = null;
      for (const h of entryHits)
        if (Math.abs(px - h.x) < h.w * labelScale && Math.abs(py - h.y) < h.h * labelScale) hit = h;
      state.sel = !hit ? null
        : hit.kind === 'factor' ? { type: 'factor', i: hit.i, j: hit.j }
        : hit.kind === 'col' ? { type: 'col', i: hit.i }
        : { type: 'node', c: hit.c, j: hit.j };
      draw();
    }
    drag = null;
  });
  cv.addEventListener('pointercancel', () => { drag = null; cv.style.cursor = 'grab'; });
  cv.addEventListener('dblclick', () => {
    state.yaw = HOME.yaw; state.pitch = HOME.pitch; draw();
  });

  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
