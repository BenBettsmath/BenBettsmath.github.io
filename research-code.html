<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code</title>
<link rel="stylesheet" href="style.css">
<style>
.page-content { max-width: 860px; }
.tabs { display: flex; gap: 0.4em; border-bottom: 1px solid #d8dce1; margin: 1.4em 0 1.6em; }
.tabs button { border: none; background: none; padding: 0.7em 1.1em; font-family: 'STIX Two Text', Georgia, serif; font-weight: 700; font-size: 15px; color: #5a6068; cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button:hover { color: var(--turquoise); }
.tabs button.active { color: var(--turquoise); border-bottom-color: var(--turquoise); }
.panel { display: none; }
.panel.active { display: block; }
.downloads { display: flex; gap: 0.7em; flex-wrap: wrap; margin: 0 0 1.8em; }
.downloads a { display: inline-block; background: var(--turquoise); color: #fff; padding: 0.65em 1.3em; border-radius: 6px; font-family: 'STIX Two Text', Georgia, serif; font-weight: 700; font-size: 15px; text-decoration: none; }
.downloads a:hover { background: var(--cherry); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<div class="topnav" id="myTopnav">
  <a href="index.html">Home</a>
  <a href="research.html" class="active">Research</a>
  <a href="teaching.html">Teaching</a>
  <a href="cv.html">CV</a>
  <a href="javascript:void(0);" class="icon" onclick="toggleNav()">&#9776;</a>
</div>
<div class="page-content">
  <p class="breadcrumb"><a href="research.html">Research</a> &rsaquo; <span>Code</span></p>
  <h1>Code</h1>
  <div class="tabs">
    <button class="tab active" data-tab="gamt">General AMT</button>
    <button class="tab" data-tab="cgraph">Complex Graph</button>
  </div>

  <div class="panel active" id="gamt">
    <div class="downloads">
      <a href="code/GeneralAMT/GeneralAMT.zip" download>Download packages</a>
      <a href="code/GeneralAMT/GeneralAMT-tutorials.zip" download>Download tutorials</a>
    </div>
  </div>

  <div class="panel" id="cgraph">
    <div class="downloads">
      <a href="code/ComplexGraph/ComplexGraph.zip" download>Download packages</a>
      <a href="code/ComplexGraph/ComplexGraph-tutorials.zip" download>Download tutorials</a>
    </div>
  </div>
</div>
<footer>
  <a href="mailto:fraughn@unm.edu">fraughn@unm.edu</a> &nbsp;|&nbsp; Department of Mathematics and Statistics, University of New Mexico
</footer>
<script>
function toggleNav() { document.getElementById("myTopnav").classList.toggle("responsive") }
const tabs = document.querySelectorAll(".tab")
const panels = document.querySelectorAll(".panel")
tabs.forEach(function (t) {
  t.addEventListener("click", function () {
    tabs.forEach(function (b) { b.classList.remove("active") })
    panels.forEach(function (p) { p.classList.remove("active") })
    t.classList.add("active")
    document.getElementById(t.dataset.tab).classList.add("active")
  })
})
</script>
</body>
</html>
